environment: localMac
replicaCount: 2

image:
  repository: app-k8-deployment-health
  tag: "1.0.0"
  pullPolicy: Never

# as we are not uploading the image to jfrog , so here this is null
imagePullSecrets: []

# pod annotation is mainly consist of setting of vault , we are not using this for local , it is in appllication.yaml file
podAnnotations: null

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

#ingress:
 # enabled: false

ingress:
  enabled: true
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

  hosts:
    - host: myAppK8Deployment.com.au
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: appK8Deployment-local-tls
      hosts:
        - myAppK8Deployment.com.au

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi


autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  customMetrics:
    enabled: false


pdb:
  enabled: true
  minAvailable: 1

probes:
  readiness:
    path: /actuator/health/readiness
  liveness:
    path: /actuator/health/liveness