apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "auspost-health.fullname" . }}-test"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.16.0
      command:
        - sh
        - -c
        - curl -fsS http://{{ include "auspost-health.fullname" . }}:{{ .Values.service.port }}/health
