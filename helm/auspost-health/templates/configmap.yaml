apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auspost-health.fullname" . }}-config
  labels:
    {{- include "auspost-health.labels" . | nindent 4 }}
data:
  application.yaml: |
    server:
      port: 8080
    app:
      version: {{ .Values.image.tag | quote }}
      environment: {{ .Release.Namespace | quote }}
