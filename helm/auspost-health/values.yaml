replicaCount: 2

image:
  repository: "jfrog.example.com/AusPostJrog/auspost-health"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-inject-status: "update"
  vault.hashicorp.com/role: "auspost-health"
  vault.hashicorp.com/auth-path: "auth/kubernetes"
  vault.hashicorp.com/agent-inject-secret-application.properties: "config/data/auspost-health/dev"
  vault.hashicorp.com/agent-inject-template-application.properties: |
    {{- with secret "config/data/auspost-health/dev" -}}
    app.message={{ .Data.data.APP_MESSAGE }}
    app.feature.enabled={{ .Data.data.APP_FEATURE_FLAG }}
    {{- end }}
  vault.hashicorp.com/agent-inject-secret-sec.properties: "sec_kv/data/auspost-health/dev"
  vault.hashicorp.com/agent-inject-template-sec.properties: |
    {{- with secret "sec_kv/data/auspost-health/dev" -}}
    app.security.client-id={{ .Data.data.API_CLIENT_ID }}
    app.security.client-secret={{ .Data.data.API_CLIENT_SECRET }}
    {{- end }}
  vault.hashicorp.com/agent-inject-secret-tls.crt: "pki/issue/auspost-health"
  vault.hashicorp.com/agent-inject-template-tls.crt: |
    {{- with pkiCert "pki/issue/auspost-health" "common_name=myauspost.com.au" "ttl=24h" -}}
    {{ .Cert }}
    {{- end }}
  vault.hashicorp.com/agent-inject-file-tls.crt: "tls.crt"
  vault.hashicorp.com/secret-volume-path: "/vault/secrets"
  vault.hashicorp.com/tls-skip-verify: "false"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  host: myauspost.com.au
  path: /
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/group.name: auspost-health
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

probes:
  readiness:
    path: /actuator/health/readiness
  liveness:
    path: /actuator/health/liveness

nodeSelector: {}
tolerations: []
affinity: {}
