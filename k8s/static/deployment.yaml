apiVersion: apps/v1
kind: Deployment
metadata:
  name: auspost-health
  namespace: auspost-dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auspost-health
  template:
    metadata:
      labels:
        app: auspost-health
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "auspost-health-dev"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-inject-secret-application.properties: "config/data/auspost-health/dev"
        vault.hashicorp.com/agent-inject-template-application.properties: |
          {{- with secret "config/data/auspost-health/dev" -}}
          app.message={{ .Data.data.APP_MESSAGE }}
          app.feature.enabled={{ .Data.data.APP_FEATURE_FLAG }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-sec.properties: "sec_kv/data/auspost-health/dev"
        vault.hashicorp.com/agent-inject-template-sec.properties: |
          {{- with secret "sec_kv/data/auspost-health/dev" -}}
          app.security.client-id={{ .Data.data.API_CLIENT_ID }}
          app.security.client-secret={{ .Data.data.API_CLIENT_SECRET }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: jfrog-registry
      serviceAccountName: auspost-health
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: auspost-health
          image: jfrog.example.com/AusPostJrog/auspost-health:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auspost-health
  namespace: auspost-dev
